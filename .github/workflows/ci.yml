name: RemitIQ Household Service CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================================
  # CI - Tests and Static Analysis
  # ============================================================================

  test:
    name: Tests & Static Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remitiq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remitiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, mbstring, intl, bcmath, gd, zip, exif
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate JWT keys
        run: |
          mkdir -p storage/app/keys
          openssl genrsa -out storage/app/keys/jwt-private.pem 2048
          openssl rsa -in storage/app/keys/jwt-private.pem -pubout -out storage/app/keys/jwt-public.pem

      - name: Configure test environment
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=remitiq_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env
          sed -i "s#^JWT_PRIVATE_KEY=.*#JWT_PRIVATE_KEY=\"file://$(pwd)/storage/app/keys/jwt-private.pem\"#" .env
          sed -i "s#^JWT_PUBLIC_KEY=.*#JWT_PUBLIC_KEY=\"file://$(pwd)/storage/app/keys/jwt-public.pem\"#" .env

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Laravel Pint
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: composer analyse

      - name: Dependency vulnerability audit
        run: composer audit

      - name: PHPUnit
        run: php artisan test --parallel

  # ============================================================================
  # Production Docker Image
  # ============================================================================

  docker:
    name: Build Production Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Production Deployment
  # ============================================================================

  deploy:
    name: Deploy Production
    needs: docker

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script_stop: true

          script: |
            cd "${{ secrets.PRODUCTION_APP_PATH }}"

            docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              -p "${{ secrets.GHCR_TOKEN }}"

            docker compose pull household-service-prod queue-prod scheduler-prod nginx-prod

            docker compose up -d household-service-prod

            docker compose exec -T household-service-prod \
              php artisan migrate --force

            docker compose exec -T household-service-prod \
              php artisan optimize:clear

            docker compose exec -T household-service-prod \
              php artisan optimize

            docker compose up -d queue-prod
            docker compose up -d scheduler-prod
            docker compose up -d nginx-prod

            docker compose ps
