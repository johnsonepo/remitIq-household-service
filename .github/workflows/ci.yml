name: RemitIQ Household Service CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: johnsonepo/remitiq-household-service

jobs:

  # ============================================================================
  # CI - Tests and Static Analysis via Docker Compose
  # ============================================================================

  test:
    name: Tests & Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Environment File
        run: |
          cp .env.example .env

      - name: Build and Start Containers
        run: |
          docker compose up -d --build

      - name: Generate Application Key and JWT Keys in Container
        run: |
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app mkdir -p storage/app/keys
          docker compose exec -T app openssl genrsa -out storage/app/keys/jwt-private.pem 2048
          docker compose exec -T app openssl rsa -in storage/app/keys/jwt-private.pem -pubout -out storage/app/keys/jwt-public.pem

      - name: Configure Test Environment Variables
        run: |
          docker compose exec -T app sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          docker compose exec -T app sed -i 's/^DB_HOST=.*/DB_HOST=postgres/' .env
          docker compose exec -T app sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          docker compose exec -T app sed -i 's/^DB_DATABASE=.*/DB_DATABASE=remitiq_test/' .env
          docker compose exec -T app sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          docker compose exec -T app sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          docker compose exec -T app sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env
          docker compose exec -T app sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env
          docker compose exec -T app sed -i 's#^JWT_PRIVATE_KEY=.*#JWT_PRIVATE_KEY="file:///var/www/html/storage/app/keys/jwt-private.pem"#g' .env
          docker compose exec -T app sed -i 's#^JWT_PUBLIC_KEY=.*#JWT_PUBLIC_KEY="file:///var/www/html/storage/app/keys/jwt-public.pem"#g' .env

      - name: Clear Laravel Caches
        run: |
          docker compose exec -T app php artisan optimize:clear

      - name: Run Database Migrations
        run: |
          docker compose exec -T app php artisan migrate --force

      - name: Laravel Pint
        run: |
          docker compose exec -T app ./vendor/bin/pint --test

      - name: PHPStan
        run: |
          docker compose exec -T app composer analyse

      - name: Dependency Vulnerability Audit
        run: |
          docker compose exec -T app composer audit

      - name: PHPUnit Tests in Container
        run: |
          docker compose exec -T app php artisan test

      - name: Tear Down Docker Environment
        if: always()
        run: |
          docker compose down

  # ============================================================================
  # Production Docker Image
  # ============================================================================

  docker:
    name: Build Production Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Production Deployment
  # ============================================================================

  deploy:
    name: Deploy Production
    needs: docker

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script_stop: true

          script: |
            cd "${{ secrets.PRODUCTION_APP_PATH }}"

            docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              -p "${{ secrets.GHCR_TOKEN }}"

            docker compose pull household-service-prod queue-prod scheduler-prod nginx-prod

            docker compose up -d household-service-prod

            docker compose exec -T household-service-prod \
              php artisan migrate --force

            docker compose exec -T household-service-prod \
              php artisan optimize:clear

            docker compose exec -T household-service-prod \
              php artisan optimize

            docker compose up -d queue-prod
            docker compose up -d scheduler-prod
            docker compose up -d nginx-prod

            docker compose ps
