name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================
  # Code Quality & Static Analysis
  # ==========================
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, redis
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Run PHPStan (Static Analysis)
        run: composer analyse

      - name: Composer Security Audit
        run: composer audit

  # ==========================
  # Tests (Inside Docker Compose)
  # ==========================
  test:
    name: Tests (Docker)
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Build and Start Docker Containers
        run: docker compose up -d --build

      - name: Install Dependencies inside Container
        run: docker compose exec -T household-service composer install --no-interaction --no-progress --prefer-dist

      - name: Generate PHPUnit Configuration Dynamically
        run: |
          docker compose exec -T household-service bash -c 'cat << '\''EOF'\'' > phpunit.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <phpunit xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:noNamespaceSchemaLocation="vendor/phpunit/phpunit/phpunit.xsd"
                   bootstrap="vendor/autoload.php"
                   colors="true"
          >
              <testsuites>
                  <testsuite name="Unit">
                      <directory>tests/Unit</directory>
                  </testsuite>
                  <testsuite name="Feature">
                      <directory>tests/Feature</directory>
                  </testsuite>
              </testsuites>
              <source>
                  <include>
                      <directory>app</directory>
                  </include>
              </source>
              <php>
                  <env name="APP_ENV" value="testing"/>
                  <env name="BCRYPT_ROUNDS" value="4"/>
                  <env name="CACHE_STORE" value="redis"/>
                  <env name="DB_CONNECTION" value="pgsql"/>
                  <env name="DB_DATABASE" value="remitiq_test"/>
                  <env name="MAIL_MAILER" value="array"/>
                  <env name="QUEUE_CONNECTION" value="redis"/>
                  <env name="SESSION_DRIVER" value="redis"/>
                  <env name="TELESCOPE_ENABLED" value="false"/>
              </php>
          </phpunit>
          EOF'

      - name: Generate Application Key and JWT Keys
        run: |
          docker compose exec -T household-service php artisan key:generate
          docker compose exec -T household-service mkdir -p storage/app/keys
          docker compose exec -T household-service openssl genrsa -out storage/app/keys/jwt-private.pem 2048
          docker compose exec -T household-service openssl rsa -in storage/app/keys/jwt-private.pem -pubout -out storage/app/keys/jwt-public.pem

      - name: Configure Test Environment Variables inside Container
        run: |
          docker compose exec -T household-service sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          docker compose exec -T household-service sed -i 's/^DB_HOST=.*/DB_HOST=household-db/' .env
          docker compose exec -T household-service sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          docker compose exec -T household-service sed -i 's/^DB_DATABASE=.*/DB_DATABASE=remitiq_test/' .env
          docker compose exec -T household-service sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          docker compose exec -T household-service sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          docker compose exec -T household-service sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env
          docker compose exec -T household-service sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env

      - name: Run Database Migrations
        run: docker compose exec -T household-service php artisan migrate --force

      - name: Run PHPUnit Tests
        run: docker compose exec -T household-service php artisan test

      - name: Tear Down Containers
        if: always()
        run: docker compose down

  # ==========================
  # Docker Build Verification
  # ==========================
  docker-build:
    name: Docker Build (production target)
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: remitiq-household-service:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
