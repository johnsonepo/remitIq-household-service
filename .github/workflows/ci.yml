cd "${{ secrets.PRODUCTION_APP_PATH }}"

            # Pull latest code updates from git repository
            git pull origin main

            # Build production services locally from the Dockerfile's production target
            docker compose build household-service-prod queue-prod scheduler-prod

            docker compose up -d household-service-prod

            docker compose exec -T household-service-prod \
              php artisan migrate --force

            docker compose exec -T household-service-prod \
              php artisan optimize:clear

            docker compose exec -T household-service-prod \
              php artisan optimize

            docker compose up -d queue-prod
            docker compose up -d scheduler-prod
            docker compose up -d nginx-prod

            docker compose ps
