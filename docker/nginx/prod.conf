server_tokens off;

server {
    listen 80;
    server_name _;

    # If you have a TLS certificate, redirect all HTTP traffic to HTTPS
    # and remove the "location /" and "location ~ \.php$" blocks below
    # in favor of the HTTPS server block underneath.
    #
    # return 301 https://$host$request_uri;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass household-service-prod:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ------------------------------------------------------------------------------
# HTTPS — uncomment and fill in cert paths once you have a certificate
# (e.g. via certbot mounted into ./docker/nginx/certs, or a load balancer
# terminating TLS in front of this container instead).
# ------------------------------------------------------------------------------
#
# server {
#     listen 443 ssl http2;
#     server_name _;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     root /var/www/html/public;
#     index index.php;
#
#     # ... same location blocks as above ...
# }
