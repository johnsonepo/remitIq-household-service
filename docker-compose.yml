services:

  # ============================================================================
  # Laravel Household Service (Development)
  # ============================================================================

  household-service:

    container_name: remitiq-household-service

    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-development}
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}

    restart: unless-stopped

    working_dir: /var/www/html

    user: root

    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor

    command:
      - sh
      - -c
      - >
        chown -R www-data:www-data storage bootstrap/cache &&
        php-fpm

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE}

      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT}
      SESSION_PATH: ${SESSION_PATH}
      SESSION_DOMAIN: ${SESSION_DOMAIN}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}

      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    healthcheck:
      test:
        - CMD-SHELL
        - php-fpm -t
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    depends_on:

      household-db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Laravel Queue Worker (Development)
  # ============================================================================

  queue:

    container_name: remitiq-household-queue

    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-development}
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}

    restart: unless-stopped

    working_dir: /var/www/html

    user: www-data

    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor

    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE}

      SESSION_DRIVER: ${SESSION_DRIVER}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}

      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}

    depends_on:

      household-db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Nginx (Development)
  # ============================================================================

  nginx:

    container_name: remitiq-household-nginx

    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:

      household-service:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Laravel Household Service (Production)
  # ----------------------------------------------------------------------------
  # Pulls the image already built by CI (see .github/workflows) rather than
  # building locally. Runs the same single multi-stage Dockerfile's
  # `production` target — no separate Dockerfile is used. Reuses the same
  # household-db / redis containers defined below; if you later move to a
  # managed Postgres/Redis instance, only DB_HOST/REDIS_HOST need to change.
  # ============================================================================

  household-service-prod:

    container_name: remitiq-household-service-prod

    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}

    restart: unless-stopped

    working_dir: /var/www/html

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE}

      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT}
      SESSION_PATH: ${SESSION_PATH}
      SESSION_DOMAIN: ${SESSION_DOMAIN}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}

      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}

      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    healthcheck:
      test:
        - CMD-SHELL
        - php-fpm -t
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    depends_on:

      household-db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Laravel Queue Worker (Production)
  # ============================================================================

  queue-prod:

    container_name: remitiq-household-queue-prod

    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}

    restart: unless-stopped

    working_dir: /var/www/html

    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE}

      SESSION_DRIVER: ${SESSION_DRIVER}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}

      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}

      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}

    depends_on:

      household-db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Laravel Scheduler (Production)
  # ----------------------------------------------------------------------------
  # The production PHP-FPM image has no cron daemon, so this container
  # invokes `php artisan schedule:run` every 60 seconds instead — the
  # standard pattern for running Laravel's scheduler under Docker. Any
  # tasks registered in the app's scheduler (routes/console.php or
  # app/Console/Kernel.php depending on Laravel version) will fire from
  # here once real scheduled tasks exist; there are none yet.
  # ============================================================================

  scheduler-prod:

    container_name: remitiq-household-scheduler-prod

    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}

    restart: unless-stopped

    working_dir: /var/www/html

    command:
      - sh
      - -c
      - >
        while true; do
          php artisan schedule:run --no-interaction --verbose;
          sleep 60;
        done

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE}

      SESSION_DRIVER: ${SESSION_DRIVER}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}

      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}

      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}

    depends_on:

      household-db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Nginx (Production)
  # ============================================================================

  nginx-prod:

    container_name: remitiq-household-nginx-prod

    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro

    depends_on:

      household-service-prod:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # PostgreSQL
  # ============================================================================

  household-db:

    container_name: remitiq-household-db

    image: postgres:16-alpine

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:

      - household-postgres-data:/var/lib/postgresql/data

    ports:

      - "5434:5432"

    healthcheck:

      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - remitiq-network


  # ============================================================================
  # Redis
  # ============================================================================

  redis:

    container_name: remitiq-household-redis

    image: redis:7-alpine

    restart: unless-stopped

    ports:

      - "6380:6379"

    volumes:

      - redis-data:/data

    healthcheck:

      test:
        - CMD
        - redis-cli
        - ping

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - remitiq-network


  # ============================================================================
  # Mailpit
  # ============================================================================

  mailpit:

    container_name: remitiq-mailpit

    image: axllent/mailpit:latest

    restart: unless-stopped

    ports:

      - "8025:8025"
      - "1025:1025"

    networks:
      - remitiq-network


# ==============================================================================
# Volumes
# ==============================================================================

volumes:

  household-postgres-data:

  redis-data:

  vendor:


# ==============================================================================
# Network
# ==============================================================================

networks:

  remitiq-network:

    driver: bridge
