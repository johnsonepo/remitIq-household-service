# ============================================================================
  # Laravel Household Service (Production)
  # ============================================================================

  household-service-prod:

    container_name: remitiq-household-service-prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped

    working_dir: /var/www/html

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT}
      SESSION_PATH: ${SESSION_PATH}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    healthcheck:
      test:
        - CMD-SHELL
        - php-fpm -t
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Laravel Queue Worker (Production)
  # ============================================================================

  queue-prod:

    container_name: remitiq-household-queue-prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped

    working_dir: /var/www/html

    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}

    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - remitiq-network


  # ============================================================================
  # Laravel Scheduler (Production)
  # ============================================================================

  scheduler-prod:

    container_name: remitiq-household-scheduler-prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped

    working_dir: /var/www/html

    command:
      - sh
      - -c
      - >
        while true; do
          php artisan schedule:run --no-interaction --verbose;
          sleep 60;
        done

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}

    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - remitiq-network
