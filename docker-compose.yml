version: '3.8'

services:
  # ============================================================================
  # Development Services
  # ============================================================================
  household-service:
    container_name: remitiq-household-service-dev
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-remitiq_dev}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitiq-network

  household-db:
    image: postgres:16-alpine
    container_name: remitiq-household-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-remitiq_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-remitiq_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - remitiq-network

  redis:
    image: redis:7-alpine
    container_name: remitiq-household-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - remitiq-network

  # ============================================================================
  # Laravel Household Service (Production)
  # ============================================================================
  household-service-prod:
    container_name: remitiq-household-service-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_PROD_DATABASE:-remitiq_prod}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT}
      SESSION_PATH: ${SESSION_PATH}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    healthcheck:
      test:
        - CMD-SHELL
        - php-fpm -t
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitiq-network

  # ============================================================================
  # Laravel Queue Worker (Production)
  # ============================================================================
  queue-prod:
    container_name: remitiq-household-queue-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_PROD_DATABASE:-remitiq_prod}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}
    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitiq-network

  # ============================================================================
  # Laravel Scheduler (Production)
  # ============================================================================
  scheduler-prod:
    container_name: remitiq-household-scheduler-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    working_dir: /var/www/html
    command:
      - sh
      - -c
      - >
        while true; do
          php artisan schedule:run --no-interaction --verbose;
          sleep 60;
        done
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_PROD_DATABASE:-remitiq_prod}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY}
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT}
    depends_on:
      household-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitiq-network

networks:
  remitiq-network:
    driver: bridge

volumes:
  pgdata:
